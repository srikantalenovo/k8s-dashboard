# k8s-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grepmind-sa
  namespace: grepmind

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grepmind-cluster-access
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grepmind-cluster-access-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grepmind-cluster-access
subjects:
  - kind: ServiceAccount
    name: grepmind-sa
    namespace: grepmind
